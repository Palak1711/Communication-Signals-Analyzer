<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Communication Signal Analyzer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
            background: #f5f5f5;
        }
        h1 { color: #333; }
        #startBtn {
            padding: 14px 28px;
            font-size: 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #startBtn:hover { background: #1d4ed8; }
        #timer {
            font-size: 24px;
            margin-top: 20px;
            display: none;
        }
        #results {
            margin-top: 30px;
            display: none;
            text-align: left;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <h1>Communication Signal Analyzer</h1>
    <p>Click Start, speak for 10 seconds, get your communication signals score.</p>

    <button id="startBtn">Start Session</button>

    <div id="timer">Recording... <span id="countdown">10</span>s remaining</div>

    <div id="results">
        <h2>Your Results</h2>
        <p>Results will appear here.</p>
    </div>

    <script>
function displayResults(data) {
    const resultsDiv = document.getElementById('results');
    resultsDiv.style.display = 'block';

    if (data.status === 'no_speech') {
        resultsDiv.innerHTML = '<h2>No speech detected</h2>' +
            '<p>Please try again and make sure you are speaking clearly.</p>';
        return;
    }

    if (data.status === 'error') {
        resultsDiv.innerHTML = '<h2>Something went wrong</h2>' +
            '<p>Please try again.</p>';
        return;
    }

    if (data.needs_retry) {
        resultsDiv.innerHTML = '<h2>Almost there</h2>' +
            '<p>This session needs a bit more practice before scoring feels meaningful.</p>';
        return;
    }

    let html = '<h2>Your Communication Signals Score: ' + data.final_score + '/100</h2>';
     html += '<p>Voice: ' + data.voice_score +
            ' &nbsp;|&nbsp; Body Language: ' + data.body_score +
            ' &nbsp;|&nbsp; Communication: ' + data.comm_score + '</p>';

    html += '<h3>Strengths</h3><ul>';
    data.strengths.forEach(function(s) {
        html += '<li>' + s + '</li>';
    });
    html += '</ul>';

    html += '<h3>Areas to improve</h3><ul>';
    data.weaknesses.forEach(function(w) {
        html += '<li>' + w + '</li>';
    });
    html += '</ul>';

    resultsDiv.innerHTML = html;
}

document.getElementById('startBtn').addEventListener('click', function() {
    const btn = document.getElementById('startBtn');
    btn.disabled = true;
    btn.textContent = 'Recording... please wait';

    fetch('/start-session', { method: 'POST' })
        .then(response => response.json())
        .then(data => {
            btn.disabled = false;
            btn.textContent = 'Start Session';
            displayResults(data);
        })
        .catch(error => {
            btn.disabled = false;
            btn.textContent = 'Start Session';
            console.error('Error:', error);
        });
});
</script>
</body>
</html>
