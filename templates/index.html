<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Communication Signal Analyzer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
            background: #f5f5f5;
        }
        h1 { color: #333; }
        #startBtn {
            padding: 14px 28px;
            font-size: 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #startBtn:hover { background: #1d4ed8; }
        #timer {
            font-size: 24px;
            margin-top: 20px;
            display: none;
         }
        #results {
            margin-top: 30px;
            display: none;
            text-align: left;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <h1>Communication Signal Analyzer</h1>
    <p>Click Start, speak for 10 seconds, get your communication signals score.</p>

    <button id="startBtn">Start Session</button>

    <div id="timer">Recording... <span id="countdown">10</span>s remaining</div>

    <div id="results">
        <h2>Your Results</h2>
        <p>Results will appear here.</p>
    </div>
</body>
</html>
