<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Communication Signal Analyzer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
            background: #f5f5f5;
        }
        h1 { color: #333; }
        #startBtn {
            padding: 14px 28px;
            font-size: 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #startBtn:hover { background: #1d4ed8; }
        #timer {
            font-size: 24px;
            margin-top: 20px;
            display: none;
        }
        #results {
            margin-top: 30px;
            display: none;
            text-align: left;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .spinner {
            border: 4px solid #ddd;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #loading {
            display: none;
            margin-top: 20px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
    <h1>Communication Signal Analyzer</h1>
    <p>Click Start, speak for 10 seconds, get your communication signals score.</p>

    <button id="startBtn">Start Session</button>

    <div id="timer">Recording... <span id="countdown">10</span>s remaining</div>

    <div id="loading">
        <div class="spinner"></div>
        <p id="loadingText">Analyzing your session...</p>
    </div>

    <div id="results">
        <h2>Your Results</h2>
        <p>Results will appear here.</p>
    </div>

    <script>
let scoreChart = null;

function displayResults(data) {
    const resultsDiv = document.getElementById('results');
    resultsDiv.style.display = 'block';

    if (data.status === 'no_speech') {
        resultsDiv.innerHTML = '<h2>No speech detected</h2>' +
            '<p>Please try again and make sure you are speaking clearly.</p>';
        return;
    }

    if (data.status === 'error') {
        resultsDiv.innerHTML = '<h2>Something went wrong</h2>' +
            '<p>Please try again.</p>';
        return;
    }

    if (data.needs_retry) {
        resultsDiv.innerHTML = '<h2>Almost there</h2>' +
            '<p>This session needs a bit more practice before scoring feels meaningful.</p>';
        return;
    }

    let html = '<h2>Your Communication Signals Score: ' + data.final_score + '/100</h2>';
    html += '<canvas id="scoreChart" width="400" height="250"></canvas>';

    html += '<h3>Strengths</h3><ul>';
    data.strengths.forEach(function(s) {
        html += '<li>' + s + '</li>';
    });
    html += '</ul>';

    html += '<h3>Areas to improve</h3><ul>';
    data.weaknesses.forEach(function(w) {
        html += '<li>' + w + '</li>';
    });
    html += '</ul>';

    resultsDiv.innerHTML = html;

    if (scoreChart) {
        scoreChart.destroy();
    }

    const ctx = document.getElementById('scoreChart').getContext('2d');

    scoreChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Voice', 'Body Language', 'Communication'],
            datasets: [{
                label: 'Score out of 100',
                data: [data.voice_score, data.body_score, data.comm_score],
                backgroundColor: ['#2563eb', '#16a34a', '#f59e0b']
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    max: 100
                }
            }
        }
    });
}
const loadingMessages = [
    "Analyzing your voice...",
    "Checking eye contact and body language...",
    "Reviewing what you said...",
    "Almost done..."
];

document.getElementById('startBtn').addEventListener('click', function() {
    const btn = document.getElementById('startBtn');
    const timerDiv = document.getElementById('timer');
    const countdownSpan = document.getElementById('countdown');
    const resultsDiv = document.getElementById('results');
    const loadingDiv = document.getElementById('loading');
    const loadingText = document.getElementById('loadingText');

    btn.disabled = true;
    resultsDiv.style.display = 'none';
    loadingDiv.style.display = 'none';
    timerDiv.style.display = 'block';

    let secondsLeft = 10;
    countdownSpan.textContent = secondsLeft;
    let messageIndex = 0;
    let messageInterval;

    const countdownInterval = setInterval(function() {
        secondsLeft = secondsLeft - 1;
        countdownSpan.textContent = secondsLeft;

        if (secondsLeft <= 0) {
            clearInterval(countdownInterval);
            timerDiv.style.display = 'none';
            btn.textContent = 'Analyzing...';

            loadingDiv.style.display = 'block';
            loadingText.textContent = loadingMessages[0];
            messageInterval = setInterval(function() {
                messageIndex = (messageIndex + 1) % loadingMessages.length;
                loadingText.textContent = loadingMessages[messageIndex];
            }, 3000);
        }
    }, 1000);

    fetch('/start-session', { method: 'POST' })
        .then(response => response.json())
        .then(data => {
            clearInterval(messageInterval);
            loadingDiv.style.display = 'none';
            btn.disabled = false;
            btn.textContent = 'Start Session';
            displayResults(data);
        })
        .catch(error => {
            clearInterval(countdownInterval);
            clearInterval(messageInterval);
            timerDiv.style.display = 'none';
            loadingDiv.style.display = 'none';
            btn.disabled = false;
            btn.textContent = 'Start Session';
            console.error('Error:', error);
        });
});
</script>
</body>
</html>
